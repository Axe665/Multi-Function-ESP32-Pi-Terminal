name: 大文件闸门

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 新增文件不得超过 20 MB
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          fail=0
          while read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              # 语音模型本来就是这个量级，不是构建产物
              pi_terminal/assets/voices/*) continue ;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -gt 20971520 ]; then
              echo "::error file=$f::${size} 字节，超过 20 MB；构建产物请走 GitHub Release（AGENTS.md 第四条）"
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=A "$base"...HEAD)
          exit "$fail"
