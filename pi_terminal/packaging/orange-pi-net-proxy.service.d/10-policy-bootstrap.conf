[Service]
# 代理启动时若策略文件不存在，reloadPolicy() 会提前 return，目录从未加入
# QFileSystemWatcher，宿主之后写 policy 永远不热载（源码缺陷的临时规避）。
#
# 不要用 RuntimeDirectoryPreserve=yes：dynamic user 下会变成 /run/private
# 符号链接、宿主无法写策略。
# 也不要写 printf %s：%s 是 systemd specifier，会被展开成用户 shell（/bin/bash），
# 策略文件变成 9 字节的 "/bin/bash"，代理解析失败后 allowed=[]，六条通道全拒。
# 这里用 printf 的八进制转义产生双引号，unit 解析不会吃掉引号。
ExecStartPre=/bin/sh -c 'test -f /run/orpi-net-proxy/policy.json || printf "{\42channels\42:{},\42version\42:4}" > /run/orpi-net-proxy/policy.json'
